<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="藏宝阁账号数据查询与可视化面板：价格、一速、头尾、签到天数多维筛选与图表分析" />
    <title>藏宝阁数据面板</title>
    <!-- 内联 SVG favicon：避免浏览器请求 /favicon.ico 得到 404（控制台会报一条红色错误） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5a45'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // 主题要在首帧之前定下来，否则会先闪一下浅色再跳到深色。
      // 这里直接读 localStorage，与 store 里的键名保持一致（cbg-theme）。
      (function () {
        try {
          var t = localStorage.getItem('cbg-theme');
          if (t !== 'light' && t !== 'dark') {
            // 没存过就跟随系统
            var prefersLight =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            t = prefersLight ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
