<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="藏宝阁账号数据查询与可视化面板：价格、一速、头尾、签到天数多维筛选与图表分析" />
    <title>藏宝阁数据面板</title>
    <script>
      // 主题要在首帧之前定下来，否则会先闪一下浅色再跳到深色。
      // 这里直接读 localStorage，与 store 里的键名保持一致（cbg-theme）。
      (function () {
        try {
          var t = localStorage.getItem('cbg-theme');
          if (t !== 'light' && t !== 'dark') {
            // 没存过就跟随系统
            var prefersLight =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            t = prefersLight ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
